server.port=8080

# --- SQL Server Express ---
# Habilitar TCP/IP (puerto 1433) en SQL Server Configuration Manager y autenticación mixta.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FerreteriaLosOlivos;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:CambiaEstaClave123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Seguridad ---
# El secreto JWT debe tener 32 caracteres o más. Cámbialo en tu máquina con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ferreteria-los-olivos-secreto-de-desarrollo-2026}
app.jwt.expiration-minutes=480
app.cors.origins=http://localhost:5173

# Contraseñas iniciales (se aplican a los usuarios del script 02 que tienen el marcador REEMPLAZAR_HASH_BCRYPT_*)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123}
app.seed.vendedor-password=${SEED_VENDEDOR_PASSWORD:Vendedor123}
